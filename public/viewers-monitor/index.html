<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewers Monitor - Chat Unifier</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --font-size: 4rem;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            align-items: flex-start; /* Alinhado ao Topo */
            justify-content: center;
            transition: all 0.3s ease;
            overflow: hidden;
            padding-top: calc(var(--font-size) * 0.5); /* Padding dinâmico */
        }

        #monitor-container {
            display: flex;
            align-items: center;
            gap: calc(var(--font-size) * 0.8);
            padding: calc(var(--font-size) * 0.4) calc(var(--font-size) * 0.8);
            border-radius: calc(var(--font-size) * 0.4);
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .platforms-grid {
            display: flex;
            gap: calc(var(--font-size) * 0.6);
            align-items: center;
        }

        .platform-item {
            display: inline-flex;
            align-items: center;
            gap: calc(var(--font-size) * 0.25);
            font-size: var(--font-size);
            font-weight: 900;
            line-height: 1;
        }

        .platform-item span {
            display: inline-flex;
            align-items: center;
            line-height: 1;
            transform: translateY(-0.06em);
            font-feature-settings: "tnum" 1, "cv05" 1;
        }

        .platform-icon-box {
            width: calc(var(--font-size) * 0.75);
            height: calc(var(--font-size) * 0.75);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 0;
            flex-shrink: 0;
        }
        .platform-icon-box svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        #total-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-left: calc(var(--font-size) * 0.8);
            border-left: 2px solid rgba(255,255,255,0.1);
        }

        .total-label {
            font-size: calc(var(--font-size) * 0.2);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 800;
            opacity: 0.4;
            margin-bottom: -0.2em;
        }

        .total-value {
            font-size: calc(var(--font-size) * 0.8);
            font-weight: 900;
            letter-spacing: -0.05em;
            color: var(--text-color);
        }

        .hidden { display: none !important; }

        @media (max-width: 1024px) {
            #monitor-container { transform: scale(0.9); }
        }
    </style>
</head>
<body>
    <!-- Status removido a pedido do usuário -->

    <div id="monitor-container">
        <div class="platforms-grid" id="platforms-grid">
            <!-- JS Preenche -->
        </div>
        
        <div id="total-container">
            <span class="total-label">Live Total</span>
            <span class="total-value" id="total-viewers">0</span>
        </div>
    </div>

    <script>
        const socket = io(window.location.origin || 'http://localhost:3000', { reconnection: true, reconnectionDelay: 1000, reconnectionDelayMax: 5000, reconnectionAttempts: Infinity });
        const totalDisplay = document.getElementById('total-viewers');
        const totalContainer = document.getElementById('total-container');
        const grid = document.getElementById('platforms-grid');

        const svgPaths = {
            youtube: 'M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z',
            shorts: 'm18.931 9.99-1.441-.601 1.717-.913a4.48 4.48 0 0 0 1.874-6.078 4.506 4.506 0 0 0-6.09-1.874L4.792 5.929a4.504 4.504 0 0 0-2.402 4.193 4.521 4.521 0 0 0 2.666 3.904c.036.012 1.442.6 1.442.6l-1.706.901a4.51 4.51 0 0 0-2.369 3.967A4.528 4.528 0 0 0 6.93 24c.725 0 1.437-.174 2.08-.508l10.21-5.406a4.494 4.494 0 0 0 2.39-4.192 4.525 4.525 0 0 0-2.678-3.904ZM9.597 15.19V8.824l6.007 3.184z',
            twitch: 'M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z',
            kick: 'M1.333 0h8v5.333H12V2.667h2.667V0h8v8H20v2.667h-2.667v2.666H20V16h2.667v8h-8v-2.667H12v-2.666H9.333V24h-8Z',
            tiktok: 'M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z'
        };

        function getPlatformSvg(platform) {
            if (platform === 'youtube') {
                return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/><polygon fill="#FFFFFF" points="9.545,15.568 9.545,8.432 15.818,12"/></svg>`;
            }
            if (platform === 'shorts') {
                return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#FF0000" d="m18.931 9.99-1.441-.601 1.717-.913a4.48 4.48 0 0 0 1.874-6.078 4.506 4.506 0 0 0-6.09-1.874L4.792 5.929a4.504 4.504 0 0 0-2.402 4.193 4.521 4.521 0 0 0 2.666 3.904c.036.012 1.442.6 1.442.6l-1.706.901a4.51 4.51 0 0 0-2.369 3.967A4.528 4.528 0 0 0 6.93 24c.725 0 1.437-.174 2.08-.508l10.21-5.406a4.494 4.494 0 0 0 2.39-4.192 4.525 4.525 0 0 0-2.678-3.904ZM9.597 15.19V8.824l6.007 3.184z"/><polygon fill="#FFFFFF" points="9.597,15.19 9.597,8.824 15.604,12.008"/></svg>`;
            }
            if (platform === 'twitch') {
                return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#9146FF" d="${svgPaths.twitch}"/></svg>`;
            }
            if (platform === 'kick') {
                return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#53FC18" d="${svgPaths.kick}"/></svg>`;
            }
            if (platform === 'tiktok') {
                return `
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path fill="#25F4EE" d="${svgPaths.tiktok}" opacity="0.85" transform="translate(-0.8, -0.8)"/>
                        <path fill="#FE2C55" d="${svgPaths.tiktok}" opacity="0.85" transform="translate(0.8, 0.8)"/>
                        <path fill="#FFFFFF" d="${svgPaths.tiktok}"/>
                    </svg>
                `;
            }
            return '';
        }

        socket.on('connect', () => {
            socket.emit('join-room', 'viewers');
            socket.emit('request-viewers-update');
            socket.emit('get-config');
        });

        let currentChannelsOrder = ['youtube', 'shorts', 'twitch', 'kick', 'tiktok'];
        let lastData = null;

        socket.on('config-update', (config) => {
            if (config) {
                const viewersConfig = config.viewersConfig || config;
                if (viewersConfig.channelsOrder) {
                    currentChannelsOrder = viewersConfig.channelsOrder;
                }
                const monitor = viewersConfig.monitor || {};
                document.body.style.setProperty('--bg-color', monitor.bgColor || '#0f172a');
                document.body.style.setProperty('--text-color', monitor.textColor || '#f8fafc');
                document.body.style.setProperty('--font-size', (monitor.fontSize || 4) + 'rem');
                
                if (monitor.showTotal === false) {
                    totalContainer.classList.add('hidden');
                } else {
                    totalContainer.classList.remove('hidden');
                }

                if (lastData) {
                    renderMonitor(lastData);
                }
            }
        });

        function renderMonitor(data) {
            lastData = data;
            if (!data || !data.active) {
                totalDisplay.innerText = "OFF";
                grid.innerHTML = "";
                return;
            }

            totalDisplay.innerText = data.total.toLocaleString('pt-BR');
            
            let html = '';
            for (const platform of currentChannelsOrder) {
                const count = data.counts[platform];
                if (count === undefined || count === null) continue;
                html += `
                    <div class="platform-item">
                        <div class="platform-icon-box">
                            ${getPlatformSvg(platform)}
                        </div>
                        <span>${count === '...' ? '...' : count.toLocaleString('pt-BR')}</span>
                    </div>
                `;
            }
            grid.innerHTML = html;
        }

        socket.on('viewers-update', (data) => {
            renderMonitor(data);
        });
    </script>
</body>
</html>
