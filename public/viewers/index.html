<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Unifier - Viewer Counter</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent;
            color: white;
            overflow: hidden;
        }
        #viewers-container {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 12px 24px;
            border-radius: 16px;
            font-weight: 900;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: fit-content;
            backdrop-filter: blur(8px);
        }

        .layout-vertical {
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
        }

        /* Layout Grid */
        .layout-grid {
            display: grid !important;
            grid-template-columns: repeat(2, auto);
            gap: 16px 32px;
            align-items: center;
        }

        .layout-grid .total-stat {
            grid-column: span 2;
            justify-content: center;
        }

        /* Layout Minimalista */
        .layout-minimalist {
            gap: 12px;
            padding: 8px 16px;
        }
        .layout-minimalist .icon {
            display: none !important;
        }
        
        /* Layout Pilhado */
        .layout-stacked {
            padding: 8px 16px !important;
        }
        .layout-stacked .platform-stat {
            gap: 0 !important;
            margin-left: -16px;
            position: relative;
        }
        .layout-stacked .platform-stat:first-child {
            margin-left: 0;
        }
        .layout-stacked .platform-stat .count {
            display: none !important;
        }
        .layout-stacked .icon {
            padding: 0;
        }
        .layout-stacked .total-stat {
            border-left: none !important;
            padding-left: 4px !important;
        }
        .layout-stacked .total-stat .label {
            display: none !important;
        }

        .platform-stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .icon {
            object-fit: contain;
        }

        .total-stat {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-left: 20px;
            border-left: 2px solid rgba(255,255,255,0.1);
        }

        .layout-vertical .total-stat, .layout-grid .total-stat {
            border-left: none !important;
            border-top: 2px solid rgba(255,255,255,0.1);
            padding-left: 0 !important;
            padding-top: 10px !important;
            width: 100%;
        }

        .label {
            text-transform: uppercase;
            opacity: 0.5;
            letter-spacing: 0.1em;
            font-weight: 800;
        }

        /* Layout Badges */
        .layout-badges {
            gap: 4px;
            padding: 6px 12px;
            align-items: center;
        }
        .layout-badges .platform-stat {
            border-radius: 10px;
            justify-content: center;
            gap: 0;
            flex-shrink: 0;
        }
        .layout-badges .platform-stat .count {
            display: none !important;
        }
        .layout-badges .platform-stat .icon {
            /* Sem filtros para manter a qualidade original do SVG */
        }
        .layout-badges [data-platform="twitch"]   { background: #9146FF; }
        .layout-badges [data-platform="youtube"]   { background: #FF0000; }
        .layout-badges [data-platform="shorts"]    { background: #CC0000; }
        .layout-badges [data-platform="kick"]      { background: #53FC18; }
        .layout-badges [data-platform="tiktok"]   { background: #111111; }
        .layout-badges .total-stat {
            border-left: none !important;
            padding-left: 6px !important;
            gap: 4px;
        }
        .layout-badges .total-stat .label {
            display: none !important;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div id="viewers-container">
        <!-- JS Preenche -->
    </div>
    <style id="custom-styles-container"></style>

    <script>
        const socket = io('http://localhost:3000', { reconnection: true, reconnectionDelay: 1000, reconnectionDelayMax: 5000, reconnectionAttempts: Infinity });
        const container = document.getElementById('viewers-container');
        const customStyles = document.getElementById('custom-styles-container');
        
        const icons = {
            twitch: 'https://cdn-icons-png.flaticon.com/512/5968/5968819.png',
            youtube: 'https://cdn-icons-png.flaticon.com/512/1384/1384060.png',
            shorts: 'https://cdn.simpleicons.org/youtubeshorts/FF0000',
            kick: 'https://cdn.simpleicons.org/kick/53FC18',
            tiktok: 'https://cdn-icons-png.flaticon.com/512/3046/3046121.png'
        };

        let currentConfig = {
            bgColor: '#000000', bgOpacity: 85, fontColor: '#ffffff', fontSize: 18, showTotal: true
        };
        let currentData = { counts: {}, total: 0 };

        socket.on('connect', () => {
            console.log('Conectado ao servidor de viewers');
            socket.emit('join-room', 'viewers');
            socket.emit('request-viewers-update');
            socket.emit('get-config');
        });

        socket.on('config-update', (config) => {
            if (config) {
                currentConfig = config.viewersConfig || config;
                if (customStyles) {
                    customStyles.innerHTML = (currentConfig.customCssEnabled !== false) ? (currentConfig.customCSS || '') : '';
                }
                // Força rebuild ao mudar config
                container._structureKey = null;
                render();
            }
        });

        socket.on('viewers-update', (data) => {
            currentData = data;
            render();
        });

        function formatCount(val) {
            const n = parseInt(String(val).replace(/[^0-9]/g, ''));
            if (isNaN(n)) return val;
            return n.toLocaleString('pt-BR');
        }

        function getIconUrl(platform, style) {
            if (style === 'original') return icons[platform];
            let color = style === 'white' ? 'FFFFFF' : '000000';
            if (style === 'custom') {
                const hexColor = (currentConfig.iconColor || '#ffffff').replace('#', '');
                color = hexColor;
            } else if (style !== 'black' && style !== 'white') {
                color = style.replace('#', '');
            }
            const slugs = { youtube: 'youtube', shorts: 'youtubeshorts', twitch: 'twitch', kick: 'kick', tiktok: 'tiktok' };
            return `https://cdn.simpleicons.org/${slugs[platform]}/${color}`;
        }

        function render() {
            if (!currentData || !currentData.active) {
                container.innerHTML = '';
                container.style.background = 'transparent';
                container._structureKey = null;
                return;
            }

            if (!currentData.counts || Object.keys(currentData.counts).length === 0) {
                return;
            }

            // Aplicar estilos de fundo e cor (não recriam DOM)
            const bgColor = currentConfig.bgColor || '#111111';
            const fontColor = currentConfig.fontColor || '#ffffff';
            const br = parseInt(bgColor.slice(1, 3), 16) || 0;
            const bg = parseInt(bgColor.slice(3, 5), 16) || 0;
            const bb = parseInt(bgColor.slice(5, 7), 16) || 0;
            const opacity = (currentConfig.bgOpacity !== undefined ? currentConfig.bgOpacity : 85) / 100;
            container.style.background = `rgba(${br}, ${bg}, ${bb}, ${opacity})`;
            container.style.color = fontColor;

            const getContrastColor = (hexColor) => {
                if (!hexColor) return 'white';
                const hex = hexColor.replace('#', '');
                const r = parseInt(hex.substring(0, 2), 16) || 0;
                const g = parseInt(hex.substring(2, 4), 16) || 0;
                const b = parseInt(hex.substring(4, 6), 16) || 0;
                const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
                return (yiq >= 128) ? 'black' : 'white';
            };

            const layout = currentConfig.layout || 'default';
            const spacing = currentConfig.spacing !== undefined ? currentConfig.spacing : 20;
            const channels = currentConfig.channels || {};
            const iconStyle = currentConfig.iconStyle || 'original';
            const fontSize = currentConfig.fontSize || 18;
            const iconRadius = currentConfig.iconRadius !== undefined ? currentConfig.iconRadius : 30;
            const showTotal = currentData.total > 0 && currentConfig.showTotal && (layout === 'stacked' || layout !== 'minimalist');
            const iconColor = currentConfig.iconColor || '#ffffff';
            const contrastColor = getContrastColor(iconColor);

            const effectiveIconStyle = iconStyle;
            // Tamanho do badge (caixa colorida) proporcional ao fontSize
            const badgeSize = Math.round(fontSize * 1.75);

            const channelsOrder = currentConfig.channelsOrder || ['youtube', 'shorts', 'twitch', 'kick', 'tiktok'];

            // Calcula quais plataformas devem aparecer
            const visiblePlatforms = [];
            for (const platform of channelsOrder) {
                const count = currentData.counts[platform];
                if (!count && count !== 0 && count !== '0') continue;
                if (channels[platform] && channels[platform].enabled === false) continue;
                visiblePlatforms.push(platform);
            }

            // Chave de estrutura: muda apenas quando layout/plataformas/ícone/tamanho/radius/cor mudam
            const newStructureKey = visiblePlatforms.join(',') + '|' + layout + '|' + effectiveIconStyle + '|' + fontSize + '|' + showTotal + '|' + iconRadius + '|' + (currentConfig.iconColor || '');
            const needsRebuild = !container._structureKey || container._structureKey !== newStructureKey;

            const renderIcon = (platform, idx) => {
                const isCustom = effectiveIconStyle === 'custom';
                const extraStyle = (platform === 'kick' || platform === 'shorts') ? 'transform: scale(0.8);' : '';
                const size = fontSize * 1.5;
                const innerSize = fontSize * 0.9;
                
                if (isCustom) {
                    return `
                        <div style="width: ${size}px; height: ${size}px; border-radius: ${iconRadius}% !important; background: ${iconColor} !important; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; ${layout === 'stacked' && idx > 0 ? `margin-left: -${fontSize * 0.5}px;` : ''} z-index: ${10 - idx};">
                            <img src="${getIconUrl(platform, contrastColor)}" class="icon" style="width: ${innerSize}px; height: ${innerSize}px; object-fit: contain; border-radius: ${iconRadius}% !important; ${extraStyle}">
                        </div>
                    `;
                } else {
                    return `
                        <div style="position: relative; ${layout === 'stacked' && idx > 0 ? `margin-left: -${fontSize * 0.5}px;` : ''} z-index: ${10 - idx};">
                            <img src="${getIconUrl(platform, effectiveIconStyle)}" class="icon" style="width: ${fontSize}px; height: ${fontSize}px; border-radius: ${iconRadius}% !important; ${extraStyle}">
                        </div>
                    `;
                }
            };

            if (needsRebuild) {
                // Reconstrói DOM apenas quando estrutura muda (inclui imgs dos ícones)
                container._structureKey = newStructureKey;
                container.className = '';

                if (layout === 'badges') {
                    container.style.gap = '4px';
                } else if (layout === 'stacked') {
                    container.style.gap = `${Math.floor(spacing / 2)}px`;
                } else {
                    container.style.gap = `${spacing}px`;
                }

                if (layout !== 'default') container.classList.add(`layout-${layout}`);

                let html = '';
                let idx = 0;
                for (const platform of visiblePlatforms) {
                    const count = currentData.counts[platform];

                    if (layout === 'badges') {
                        // Badge: caixa colorida com ícone centralizado (sem contagem individual)
                        // Para o Kick usamos o ícone preto ('black'), para as outras branco ('white')
                        const isCustom = effectiveIconStyle === 'custom';
                        const bgColor = isCustom ? iconColor : (badgeColors[platform] || '#444');
                        const iconColorName = isCustom ? contrastColor : (platform === 'kick' ? 'black' : 'white');
                        // Escala ajustada para os ícones ficarem proporcionais
                        const extraStyle = (platform === 'tiktok' || platform === 'kick' || platform === 'shorts') ? 'transform: scale(0.85);' : '';
                        html += `
                            <div class="platform-stat" data-platform="${platform}" style="width: ${badgeSize}px; height: ${badgeSize}px; border-radius: ${iconRadius}% !important; background: ${bgColor} !important;">
                                <img src="${getIconUrl(platform, iconColorName)}" class="icon" style="width: ${fontSize}px; height: ${fontSize}px; border-radius: ${iconRadius}% !important; ${extraStyle}">
                            </div>
                        `;
                    } else if (layout === 'stacked') {
                        html += `
                            <div class="platform-stat" data-platform="${platform}">
                                ${renderIcon(platform, idx)}
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="platform-stat" data-platform="${platform}">
                                ${renderIcon(platform, idx)}
                                <span class="count" style="font-size: ${fontSize}px;">${formatCount(count)}</span>
                            </div>
                        `;
                    }
                    idx++;
                }
                if (showTotal) {
                    const dotHtml = layout === 'badges' ? `<span class="total-dot" style="font-size: ${fontSize}px; opacity: 0.5; margin-right: 4px;">•</span>` : '';
                    html += `
                        <div class="total-stat" data-platform="__total__" style="border-color: ${fontColor}33;">
                            <span class="label" style="font-size: ${Math.max(10, fontSize * 0.55)}px;">Total</span>
                            ${dotHtml}
                            <span class="count" style="font-size: ${fontSize}px;">${formatCount(currentData.total)}</span>
                        </div>
                    `;
                }
                container.innerHTML = html;

            } else {
                // Estrutura não mudou: atualiza SOMENTE os textos de contagem, sem recriar ícones
                container.style.gap = layout === 'stacked' ? `${Math.floor(spacing / 2)}px` : `${spacing}px`;

                for (const platform of visiblePlatforms) {
                    const el = container.querySelector(`[data-platform="${platform}"] .count`);
                    if (el) {
                        const formatted = formatCount(currentData.counts[platform]);
                        if (el.textContent !== formatted) el.textContent = formatted;
                    }
                }

                const totalEl = container.querySelector('[data-platform="__total__"] .count');
                if (totalEl) {
                    const formatted = formatCount(currentData.total);
                    if (totalEl.textContent !== formatted) totalEl.textContent = formatted;
                }
            }
        }
    </script>
</body>
</html>
